  <text x="300" y="430" text-anchor="middle" fill="#0a0a0a" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="600" letter-spacing="-1.5">LayerCost</text>
  <text x="300" y="474" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="14" letter-spacing="3.2">COSTO E PREZZO DELLE STAMPE 3D</text>
